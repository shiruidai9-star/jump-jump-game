<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>跳一跳</title>
<style>
  /* 全屏、禁止选择/滚动/长按菜单 */
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e8ecf1;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #game{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block}
  #score{position:fixed;left:20px;top:calc(16px + env(safe-area-inset-top));font-size:40px;font-weight:bold;color:#333;pointer-events:none}
  #tip{position:fixed;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));text-align:center;color:#888;font-size:15px;pointer-events:none}
  #over{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff}
  #over .t{font-size:20px;opacity:.85}
  #over .s{font-size:72px;font-weight:bold;margin:10px 0 30px}
  #restart{font-size:20px;padding:12px 40px;border:0;border-radius:28px;background:#fff;color:#333;cursor:pointer}
  #mute{position:fixed;right:16px;top:calc(18px + env(safe-area-inset-top));width:44px;height:44px;border:0;border-radius:22px;
    background:rgba(255,255,255,.7);font-size:22px;line-height:44px;padding:0;cursor:pointer;z-index:5}
  #buff{position:fixed;left:20px;top:calc(66px + env(safe-area-inset-top));font-size:15px;color:#8a5cd6;font-weight:bold;pointer-events:none}
  #toast{position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top));transform:translateX(-50%);max-width:80vw;background:rgba(40,40,60,.82);
    color:#fff;font-size:15px;padding:8px 16px;border-radius:18px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score">0</div>
<button id="mute" aria-label="静音">🔊</button>
<div id="buff"></div><div id="toast"></div>
<div id="tip">长按屏幕（或按住空格）蓄力，松开跳跃</div>
<div id="over"><div class="t">本局得分</div><div class="s" id="final">0</div><button id="restart">重新开始</button></div>
<script>
(function(){
'use strict';
/* ================= 基本设置 ================= */
var canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score'), overEl=document.getElementById('over'),
    finalEl=document.getElementById('final'), tipEl=document.getElementById('tip');
var W=0,H=0,DPR=1,SCALE=1;

/* 世界坐标：x 轴向右前方，z 轴向左前方，y 向上；等轴测投影到屏幕 */
var COS=Math.cos(Math.PI/6), SIN=0.5;
var cam={x:0,z:0}, camTarget={x:0,z:0};
function project(x,y,z){
  var dx=x-cam.x, dz=z-cam.z;
  return {x:W/2+(dx-dz)*COS*SCALE, y:H*0.6-(dx+dz)*SIN*SCALE-y*SCALE};
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SCALE=Math.min(W,H*0.6)/380;
}
window.addEventListener('resize',resize);


/* ================= 音效（Web Audio 实时合成，无外部文件） ================= */
var Sound=(function(){
  var AC=window.AudioContext||window.webkitAudioContext, ac=null, master=null, chargeOsc=null, chargeGain=null;
  var muted=false; try{muted=localStorage.getItem('jump_muted')==='1';}catch(e){}
  // 首次用户操作时创建/恢复音频环境（iOS 需要在手势中播放一段静音来解锁）
  function unlock(){
    if(!AC)return;
    try{
      if(!ac){ac=new AC();master=ac.createGain();master.gain.value=0.35;master.connect(ac.destination);
        var b=ac.createBuffer(1,1,22050),src=ac.createBufferSource();src.buffer=b;src.connect(ac.destination);src.start(0);}
      if(ac.state==='suspended')ac.resume();
    }catch(e){ac=null;}
  }
  function ok(){return ac&&!muted;}
  // 播放一个音：频率、开始偏移、时长、波形、音量、可选结束频率
  function tone(f,at,dur,type,vol,f2){
    if(!ok())return;
    try{var t=ac.currentTime+(at||0),o=ac.createOscillator(),g=ac.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}catch(e){}
  }
  // 噪声（用于起跳“呼”声）
  function noise(dur,vol,from,to){
    if(!ok())return;
    try{var n=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
      for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
      var src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;
      src.buffer=buf;f.type='bandpass';f.Q.value=1.5;f.frequency.setValueAtTime(from,t);f.frequency.exponentialRampToValueAtTime(to,t+dur);
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(f);f.connect(g);g.connect(master);src.start(t);}catch(e){}
  }
  function melody(notes,type){notes.forEach(function(n,i){tone(n,i*0.12,0.18,type||'triangle',0.25);});}
  return {
    unlock:unlock,
    isMuted:function(){return muted;},
    setMuted:function(m){muted=m;try{localStorage.setItem('jump_muted',m?'1':'0');}catch(e){} if(m)this.chargeStop();},
    // 蓄力：音调随按住时间上升
    chargeStart:function(max){
      if(!ok())return;
      try{this.chargeStop();var t=ac.currentTime;chargeOsc=ac.createOscillator();chargeGain=ac.createGain();
        chargeOsc.type='triangle';chargeOsc.frequency.setValueAtTime(220,t);chargeOsc.frequency.linearRampToValueAtTime(880,t+max);
        chargeGain.gain.setValueAtTime(0.0001,t);chargeGain.gain.exponentialRampToValueAtTime(0.12,t+0.1);
        chargeOsc.connect(chargeGain);chargeGain.connect(master);chargeOsc.start(t);}catch(e){}
    },
    chargeStop:function(){
      if(!chargeOsc)return;
      try{var t=ac.currentTime;chargeGain.gain.cancelScheduledValues(t);chargeGain.gain.setValueAtTime(chargeGain.gain.value,t);
        chargeGain.gain.exponentialRampToValueAtTime(0.0001,t+0.05);chargeOsc.stop(t+0.08);}catch(e){}
      chargeOsc=null;chargeGain=null;
    },
    jump:function(){noise(0.25,0.4,600,2500);},
    land:function(){tone(140,0,0.15,'sine',0.5,60);},
    // 命中中心：连击越多音调越高（五声音阶逐级上升）
    center:function(combo){var sc=[523,587,659,784,880,1047,1175,1319,1568,1760],f=sc[Math.min(combo-1,sc.length-1)];
      tone(f,0,0.4,'sine',0.3);tone(f*2,0.02,0.3,'sine',0.1);},
    special:function(type){
      if(type==='gift')melody([784,988,1175,1568]);                 // 礼物盒：欢快上行
      else if(type==='record')melody([523,659,784,659,523,784],'sine'); // 唱片：小旋律
      else melody([659,659,880,1047],'square');                       // 魔方：电子音
    },
    // 新平台音效
    fx:function(k){
      if(k==='coin'){tone(988,0,0.1,'square',0.15);tone(1319,0.08,0.3,'square',0.15);}
      else if(k==='double'){melody([523,784,1047],'sawtooth');}
      else if(k==='spring'){tone(300,0,0.25,'sine',0.3,900);}
      else if(k==='boing'){tone(200,0,0.3,'triangle',0.3,600);}
      else if(k==='crack'){noise(0.12,0.5,3000,1500);}
      else if(k==='crumble'){noise(0.5,0.6,800,150);}
      else if(k==='portal'){tone(300,0,0.6,'sine',0.25,1200);tone(450,0.1,0.6,'sine',0.15,1800);}
    },
    fall:function(){tone(440,0,0.6,'sawtooth',0.12,110);tone(330,0.55,0.4,'triangle',0.2,220);}
  };
})();

/* ================= 参数 ================= */
var BLOCK_H=30;          // 平台高度
var MAX_CHARGE=1.6;      // 最长蓄力（秒）
var SPEED=230;           // 每秒蓄力对应的跳跃距离
var JUMP_TIME=0.5;       // 滞空时间
var FOOT=5;              // 小人脚底半径（用于边缘判定）
var CENTER_R=6;          // 命中中心的判定半径
var SPECIAL_WAIT=2;      // 特殊平台停留多少秒加分
var COLORS=['#f2b84b','#6cc3a0','#6aa8e8','#e9806e','#b49be0','#9fb3c8','#f0d264'];
// 平台类型：普通方块、圆柱；特殊：礼物盒、唱片、魔方
var SPECIALS=['gift','record','rubik'];          // 停留 2 秒 +5
// 新增特殊平台（落地即触发）
var NEWTYPES=['spring','coin','double','fragile','portal'];
var HAZARDS=['fragile'];                          // 危险平台，不会连续出现
var TIPS={gift:'礼物盒：停留 2 秒 +5',record:'唱片：停留 2 秒 +5',rubik:'魔方：停留 2 秒 +5',
  spring:'弹簧床：自动把你弹到下一个平台 +2',coin:'金币块：落上去 +10',double:'加倍块：接下来 3 跳得分翻倍',
  fragile:'脆弱块：1.5 秒后碎裂，要快跳！',portal:'传送门：直接传送到前方，跳过 2 个平台 +3'};
var seenTypes={}, toastTimer=null;
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.style.opacity=0;},2600);}

var doubleLeft=0, fx=null; // fx：平台效果计时 {type,t}
var blocks,player,score,state,chargeStart,jump,combo,particles,popups,rings,standTime;

/* 生成平台：在上一个平台的前左(z)或前右(x)方向 */
function makeBlock(prev){
  var type;
  if(window.__forceType){type=window.__forceType;window.__forceType=null;}
  else{ // 约 22% 特殊平台（旧 3 种 + 新 5 种），危险平台不连续
    var r=Math.random(), all=SPECIALS.concat(NEWTYPES);
    if(prev&&r<0.22){ do{type=all[Math.floor(Math.random()*all.length)];}
      while(HAZARDS.indexOf(type)>=0&&(HAZARDS.indexOf(prev.type)>=0||prev.type==='spring')); }
    else type=r<0.5?'cyl':'cube'; }
  var s=22+Math.random()*20;
  if(type!=='cube'&&type!=='cyl')s=30;
  if(type==='spring'||type==='portal')s=32;               // 特殊平台尺寸固定
  var b={x:0,z:0,s:s,type:type,round:(type==='cyl'||type==='record'||type==='coin'||type==='portal'),
         color:COLORS[Math.floor(Math.random()*COLORS.length)],press:0,special:SPECIALS.indexOf(type)>=0,alpha:1,dy:0};
  if(prev){
    var gap=prev.s+s+15+Math.random()*90;
    b.dir=Math.random()<0.5?'x':'z';
    b.x=prev.x+(b.dir==='x'?gap:0); b.z=prev.z+(b.dir==='z'?gap:0);
    if(TIPS[type]&&!seenTypes[type]){seenTypes[type]=1;toast(TIPS[type]);}
  }
  return b;
}
function reset(){
  blocks=[makeBlock(null)]; blocks[0].type='cube';blocks[0].round=false;blocks[0].special=false;blocks[0].s=36;
  blocks.push(makeBlock(blocks[0]));
  player={x:0,y:BLOCK_H,z:0,squash:0,rot:0,tilt:0,tdx:0,tdz:0};
  score=0;combo=0;standTime=0;doubleLeft=0;fx=null;updateBuff();particles=[];popups=[];rings=[];
  scoreEl.textContent='0'; state='idle'; jump=null;
  overEl.style.display='none';
  updateCamTarget(); cam.x=camTarget.x; cam.z=camTarget.z;
}
function cur(){return blocks[blocks.length-2];}
function next(){return blocks[blocks.length-1];}
function updateCamTarget(){camTarget.x=(cur().x+next().x)/2;camTarget.z=(cur().z+next().z)/2;}

/* 落点判定：返回 'in' 完全在上 / 'edge' 脚跨边缘 / 'out' 落空
   方块：顶面是正方形（等轴测里显示为菱形）；圆柱：顶面是圆（显示为椭圆） */
function hitTest(b,x,z){
  var dx=x-b.x,dz=z-b.z,d;
  if(b.round){ d=Math.hypot(dx,dz); if(d<=b.s)return 'in'; if(d<=b.s+FOOT)return 'edge'; return 'out'; }
  d=Math.max(Math.abs(dx),Math.abs(dz));
  if(d<=b.s)return 'in'; if(d<=b.s+FOOT)return 'edge'; return 'out';
}
function updateBuff(){document.getElementById('buff').textContent=doubleLeft>0?('得分×2 剩余 '+doubleLeft+' 跳'):'';}
// 落到新平台时触发的效果
function onSpecialLand(b){
  if(b.type==='coin'){addScore(10,b.x,b.z,'#e0a800');b.coinT=0;Sound.fx('coin');}
  else if(b.type==='double'){doubleLeft=3;updateBuff();Sound.fx('double');popups.push({x:b.x,z:b.z,y:BLOCK_H+80,text:'得分×2',life:1,color:'#8a5cd6'});}
  else if(b.type==='spring'){addScore(2,b.x,b.z,'#e9506e');fx={type:'spring',t:0};Sound.fx('spring');}
  else if(b.type==='fragile'){fx={type:'fragile',t:0,b:b};Sound.fx('crack');}
  else if(b.type==='portal'){addScore(3,b.x,b.z,'#6a4bc4');fx={type:'portal',t:0};Sound.fx('portal');}
}
// 传送：在前方生成 2 个被跳过的平台 + 1 个落脚平台
function teleport(){
  var p=next(); for(var i=0;i<2;i++){window.__forceType=window.__forceType||null;p=makeBlockNormal(p);blocks.push(p);}
  var dest=makeBlockNormal(p); blocks.push(dest);
  player.x=dest.x;player.z=dest.z;player.y=BLOCK_H;
  blocks.push(makeBlock(dest)); while(blocks.length>10)blocks.shift();
  updateCamTarget(); rings.push({x:dest.x,z:dest.z,t:0,white:true,r:dest.s});
}
function makeBlockNormal(prev){var keep=window.__forceType;window.__forceType='cube';var b=makeBlock(prev);window.__forceType=keep;return b;}
function addScore(n,x,z,color){
  score+=n; scoreEl.textContent=score;
  popups.push({x:x,z:z,y:BLOCK_H+50,text:'+'+n,life:1,color:color||'#333'});
}

/* ================= 输入 ================= */
function press(){ if(state!=='idle')return; state='charge'; chargeStart=performance.now(); tipEl.style.display='none'; Sound.chargeStart(MAX_CHARGE); }
function release(){ if(state!=='charge')return; doJump(Math.min((performance.now()-chargeStart)/1000,MAX_CHARGE)); }
// 按蓄力秒数起跳（朝下一个平台中心方向）
function doJump(t){
  var dist=Math.min(t,MAX_CHARGE)*SPEED, n=next();
  var dx=n.x-player.x,dz=n.z-player.z,len=Math.hypot(dx,dz)||1;
  jump={sx:player.x,sz:player.z,ex:player.x+dx/len*dist,ez:player.z+dz/len*dist,t:0,dir:n.dir};
  if(fx&&fx.type==='fragile')fx=null; player.squash=0; particles=[]; state='jump'; Sound.chargeStop(); Sound.jump();
}
// 首次手势解锁音频
['touchstart','touchend','mousedown','keydown'].forEach(function(ev){document.addEventListener(ev,Sound.unlock,{capture:true,passive:true});});
// 静音按钮：阻止事件冒泡，不触发跳跃
var muteBtn=document.getElementById('mute');
function syncMute(){muteBtn.textContent=Sound.isMuted()?'🔇':'🔊';}
syncMute();
['touchstart','mousedown'].forEach(function(ev){muteBtn.addEventListener(ev,function(e){e.stopPropagation();},{passive:true});});
muteBtn.addEventListener('click',function(e){e.stopPropagation();Sound.setMuted(!Sound.isMuted());syncMute();muteBtn.blur();});
muteBtn.addEventListener('keydown',function(e){e.preventDefault();});
canvas.addEventListener('touchstart',function(e){e.preventDefault();press();},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();release();},{passive:false});
canvas.addEventListener('touchcancel',function(e){e.preventDefault();release();},{passive:false});
canvas.addEventListener('mousedown',function(e){if(e.button===0)press();});
window.addEventListener('mouseup',release);
window.addEventListener('keydown',function(e){if(e.code==='Space'||e.keyCode===32){e.preventDefault();if(!e.repeat)press();}});
window.addEventListener('keyup',function(e){if(e.code==='Space'||e.keyCode===32){e.preventDefault();release();}});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.getElementById('restart').addEventListener('click',function(e){e.stopPropagation();reset();});

/* ================= 逻辑 ================= */
function update(dt){
  if(state==='charge'){
    var k=Math.min((performance.now()-chargeStart)/1000,MAX_CHARGE)/MAX_CHARGE;
    player.squash=k*0.4; cur().press=k*0.25; player.y=BLOCK_H*(1-cur().press);
    // 蓄力粒子：从四周向小人汇聚
    if(Math.random()<0.6){var a=Math.random()*Math.PI*2,r=50+Math.random()*20;
      particles.push({ox:Math.cos(a)*r,oy:Math.sin(a)*r*0.6-15,life:1});}
  }
  else if(state==='jump'){
    jump.t+=dt/JUMP_TIME; var p=Math.min(jump.t,1);
    player.x=jump.sx+(jump.ex-jump.sx)*p; player.z=jump.sz+(jump.ez-jump.sz)*p;
    player.y=BLOCK_H+Math.sin(p*Math.PI)*90; player.rot=p*Math.PI*2;
    if(p>=1){player.rot=0;land();}
  }
  else if(state==='idle'){
    // 特殊平台停留计时
    var c=cur(); standTime+=dt;
    if(fx){ fx.t+=dt;
      if(fx.type==='spring'&&fx.t>0.35){fx=null;var n=next();doJump(Math.hypot(n.x-player.x,n.z-player.z)/SPEED);jump.spring=true;Sound.fx('boing');}
      else if(fx&&fx.type==='portal'&&fx.t>0.5){fx=null;teleport();}
    }
    if(c.special&&!c.awarded&&standTime>=SPECIAL_WAIT){c.awarded=true;addScore(5,c.x,c.z,'#e9806e');Sound.special(c.type);}
  }
  else if(state==='tilt'){              // 脚跨边缘：先向外倾倒再掉落
    player.tilt+=dt*4;
    if(player.tilt>=1.2){state='fall';}
  }
  else if(state==='fall'){
    player.y-=dt*260; if(player.tilt>0){player.x+=player.tdx*dt*30;player.z+=player.tdz*dt*30;}
    if(player.y<=0){player.y=0;gameOver();}
  }
  if(fx&&fx.type==='fragile'){ fx.t+=(state==='charge')?dt:0; // 待机时在上面 idle 分支已计时
    if(fx.t>1.5&&(state==='idle'||state==='charge')&&cur()===fx.b){ // 碎裂：平台塌落，小人掉下
      fx.b.broken=true;fx=null;Sound.chargeStop();Sound.fx('crumble');state='fall';player.squash=0;}
    else if(cur()!==fx.b&&state!=='jump')fx=null; }
  blocks.forEach(function(b){ if(b.broken){b.dy-=dt*200;b.alpha=Math.max(0,b.alpha-dt*1.5);} if(b.coinT!=null)b.coinT+=dt; });
  blocks.forEach(function(b){if(state!=='charge'||b!==cur())b.press*=0.8;});
  // 粒子汇聚
  particles.forEach(function(q){q.ox*=0.9;q.oy=q.oy*0.9+(-15)*0.1;q.life-=dt*2;});
  particles=particles.filter(function(q){return q.life>0&&Math.hypot(q.ox,q.oy+15)>3;});
  popups.forEach(function(q){q.y+=dt*40;q.life-=dt*0.9;}); popups=popups.filter(function(q){return q.life>0;});
  rings.forEach(function(q){q.t+=dt*2;}); rings=rings.filter(function(q){return q.t<1;});
  cam.x+=(camTarget.x-cam.x)*Math.min(1,dt*5); cam.z+=(camTarget.z-cam.z)*Math.min(1,dt*5);
}

/* 落地判定 */
function land(){
  var x=player.x,z=player.z,n=next(),c=cur();
  var hn=hitTest(n,x,z), hc=hitTest(c,x,z);
  if(hn==='in'){
    var mult=doubleLeft>0?2:1;
    player.y=BLOCK_H; standTime=0; Sound.land();
    rings.push({x:x,z:z,t:0,white:false,r:12});         // 落地小圈（尘土）
    if(Math.hypot(x-n.x,z-n.z)<=CENTER_R){               // 命中中心：+2，连击翻倍
      combo++; addScore(2*combo*mult,x,z,'#fff'); Sound.center(combo);
      rings.push({x:n.x,z:n.z,t:0,white:true,r:n.s});
    } else { combo=0; addScore(mult,x,z); }
    if(mult>1){doubleLeft--;updateBuff();}
    blocks.push(makeBlock(n)); if(blocks.length>10)blocks.shift();
    updateCamTarget(); state='idle'; onSpecialLand(n);
  } else if(hc==='in'){                                  // 仍在原平台：不加分
    player.y=BLOCK_H; state='idle'; Sound.land();
  } else if(hn==='edge'||hc==='edge'){                   // 跨在边缘：倾倒后掉落
    var b=hn==='edge'?n:c, dx=x-b.x, dz=z-b.z, l=Math.hypot(dx,dz)||1;
    if(!b.round){ if(Math.abs(dx)>Math.abs(dz)){dx=Math.sign(dx);dz=0;}else{dz=Math.sign(dz);dx=0;} l=1; }
    player.tdx=dx/l; player.tdz=dz/l; player.y=BLOCK_H; player.tilt=0.01; state='tilt'; Sound.fall();
  } else { state='fall'; Sound.fall(); }
}
function gameOver(){state='over';finalEl.textContent=score;setTimeout(function(){overEl.style.display='flex';},300);}

/* ================= 绘制 ================= */
// 光源来自左上：顶面最亮，左面次之，右面最暗
function shade(hex,f){var n=parseInt(hex.slice(1),16);
  return 'rgb('+Math.min(255,(n>>16)*f|0)+','+Math.min(255,(n>>8&255)*f|0)+','+Math.min(255,(n&255)*f|0)+')';}
function poly(pts,fill,stroke){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill(); if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
// 圆在等轴测下是椭圆：半轴 rx=√2·r·cos30，ry=√2·r·0.5
function ellipseAt(x,y,z,r){var p=project(x,y,z);return {x:p.x,y:p.y,rx:Math.SQRT2*r*COS*SCALE,ry:Math.SQRT2*r*0.5*SCALE};}
function fillEllipse(e,fill,stroke){ctx.beginPath();ctx.ellipse(e.x,e.y,e.rx,e.ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}

function drawShadow(b){ // 投影：向右后方偏移的地面阴影
  var s=b.s,o=10;ctx.fillStyle='rgba(0,0,0,0.12)';
  if(b.round){var e=ellipseAt(b.x+o*0.3,0,b.z-o,s);fillEllipse(e,'rgba(0,0,0,0.12)');}
  else poly([project(b.x-s,0,b.z-s-o),project(b.x+s,0,b.z-s-o),project(b.x+s,0,b.z+s-o),project(b.x-s,0,b.z+s-o)],'rgba(0,0,0,0.12)');
}
function blockColor(b){return b.type==='spring'?'#5b8def':b.type==='coin'?'#f5c542':b.type==='double'?'#9b72e6':b.type==='fragile'?'#d9c3a0':b.type==='portal'?'#4b3c8c':b.type==='gift'?'#f4f4f4':b.type==='record'?'#3a3a3a':b.type==='rubik'?'#444':b.color;}
function drawBlock(b){
  if(b.alpha<=0)return;
  ctx.save();ctx.globalAlpha=b.alpha;ctx.translate(0,-b.dy*SCALE);
  // 脆弱块碎裂前抖动
  if(fx&&fx.type==='fragile'&&fx.b===b&&fx.t>0.8)ctx.translate(Math.sin(performance.now()/25)*2*SCALE,0);
  drawBlockBody(b);drawDecor(b);ctx.restore();
}
function drawDecor(b){
  var s=b.s,h=BLOCK_H*(1-b.press),c=project(b.x,h,b.z);
  if(b.type==='spring'){ // 弹簧：顶面上的锯齿弹簧 + 红色垫子
    ctx.strokeStyle='#888';ctx.lineWidth=2*SCALE;ctx.beginPath();
    for(var i=0;i<=6;i++){ctx.lineTo(c.x+(i%2?8:-8)*SCALE,c.y-i*3*SCALE);}ctx.stroke();
    ctx.fillStyle='#e9506e';ctx.beginPath();ctx.ellipse(c.x,c.y-19*SCALE,12*SCALE,5*SCALE,0,0,Math.PI*2);ctx.fill();ctx.lineWidth=1;
  }
  if(b.type==='coin'&&!(b.coinT>1)){ // 金币：悬浮旋转，被拿走后上升消失
    var t=b.coinT==null?0:b.coinT,w=Math.abs(Math.cos(performance.now()/300+(t*10)))*10+2;
    ctx.globalAlpha=b.alpha*(1-(t||0));ctx.fillStyle='#ffcf33';ctx.strokeStyle='#c99a00';
    ctx.beginPath();ctx.ellipse(c.x,c.y-(25+t*60)*SCALE,w*SCALE,12*SCALE,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.globalAlpha=b.alpha;
  }
  if(b.type==='double'){ctx.fillStyle='#fff';ctx.font='bold '+(16*SCALE|0)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('×2',c.x,c.y);ctx.textBaseline='alphabetic';}
  if(b.type==='fragile'){ // 裂纹
    ctx.strokeStyle='#8a6d45';ctx.lineWidth=1.5*SCALE;ctx.beginPath();
    var p1=project(b.x-s*0.7,h,b.z-s*0.1),p2=project(b.x,h,b.z),p3=project(b.x+s*0.5,h,b.z+s*0.6),p4=project(b.x+s*0.2,h,b.z-s*0.7);
    ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.moveTo(p2.x,p2.y);ctx.lineTo(p4.x,p4.y);ctx.stroke();ctx.lineWidth=1;
  }
  if(b.type==='portal'){ // 漩涡：旋转的同心椭圆
    var a=performance.now()/400;ctx.strokeStyle='rgba(190,160,255,0.9)';ctx.lineWidth=2*SCALE;
    [0.8,0.55,0.3].forEach(function(k,i){var e=ellipseAt(b.x,h,b.z,s*k);ctx.beginPath();ctx.ellipse(e.x,e.y,e.rx,e.ry,0,a+i,a+i+Math.PI*1.3);ctx.stroke();});ctx.lineWidth=1;
  }
}
function drawBlockBody(b){
  var s=b.s,h=BLOCK_H*(1-b.press),col=blockColor(b),edge=shade(col,0.55);
  if(b.round){
    var top=ellipseAt(b.x,h,b.z,s),bot=ellipseAt(b.x,0,b.z,s);
    var g=ctx.createLinearGradient(top.x-top.rx,0,top.x+top.rx,0);
    g.addColorStop(0,shade(col,0.9));g.addColorStop(1,shade(col,0.6));
    ctx.beginPath();ctx.moveTo(top.x-top.rx,top.y);ctx.lineTo(bot.x-bot.rx,bot.y);
    ctx.ellipse(bot.x,bot.y,bot.rx,bot.ry,0,Math.PI,0,true);ctx.lineTo(top.x+top.rx,top.y);ctx.closePath();
    ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=edge;ctx.stroke();
    fillEllipse(top,col,edge);
    if(b.type==='record'){ // 唱片：纹路 + 彩色标签
      ctx.strokeStyle='rgba(255,255,255,0.15)';
      [0.8,0.6].forEach(function(k){var e=ellipseAt(b.x,h,b.z,s*k);ctx.beginPath();ctx.ellipse(e.x,e.y,e.rx,e.ry,0,0,Math.PI*2);ctx.stroke();});
      fillEllipse(ellipseAt(b.x,h,b.z,s*0.35),'#e9806e');
    }
    fillEllipse(ellipseAt(b.x,h,b.z,4),'rgba(255,255,255,0.45)');   // 顶面中心标记
    return;
  }
  var A=project(b.x-s,h,b.z-s),B=project(b.x+s,h,b.z-s),C=project(b.x+s,h,b.z+s),D=project(b.x-s,h,b.z+s);
  var A0=project(b.x-s,0,b.z-s),B0=project(b.x+s,0,b.z-s),D0=project(b.x-s,0,b.z+s);
  poly([A,D,D0,A0],shade(col,0.85),edge);   // 左面（受光）
  poly([A,B,B0,A0],shade(col,0.62),edge);   // 右面（背光）
  poly([A,B,C,D],col,edge);                 // 顶面
  if(b.type==='gift'){ // 礼物盒：十字丝带
    ctx.strokeStyle='#e9506e';ctx.lineWidth=4*SCALE;ctx.beginPath();
    var m1=project(b.x,h,b.z-s),m2=project(b.x,h,b.z+s),m3=project(b.x-s,h,b.z),m4=project(b.x+s,h,b.z);
    ctx.moveTo(m1.x,m1.y);ctx.lineTo(m2.x,m2.y);ctx.moveTo(m3.x,m3.y);ctx.lineTo(m4.x,m4.y);
    var f1=project(b.x,0,b.z-s),f2=project(b.x-s,0,b.z);ctx.moveTo(m1.x,m1.y);ctx.lineTo(f1.x,f1.y);ctx.moveTo(m3.x,m3.y);ctx.lineTo(f2.x,f2.y);
    ctx.stroke();ctx.lineWidth=1;
  }
  if(b.type==='rubik'){ // 魔方：每面 3x3 彩色格子
    var cs=['#e9806e','#f0d264','#6cc3a0','#6aa8e8','#ffffff','#f2b84b'],k=0;
    for(var i=0;i<3;i++)for(var j=0;j<3;j++){
      var x0=b.x-s+i*2*s/3,z0=b.z-s+j*2*s/3,d=2*s/3,p=1.5;
      poly([project(x0+p,h,z0+p),project(x0+d-p,h,z0+p),project(x0+d-p,h,z0+d-p),project(x0+p,h,z0+d-p)],cs[(i*3+j)%6]);
      var y0=i*h/3; // 左面、右面
      poly([project(b.x-s,y0+p,b.z-s+j*d+p),project(b.x-s,y0+p,b.z-s+(j+1)*d-p),project(b.x-s,y0+h/3-p,b.z-s+(j+1)*d-p),project(b.x-s,y0+h/3-p,b.z-s+j*d+p)],shade(cs[(i+j+1)%6],0.85));
      poly([project(b.x-s+j*d+p,y0+p,b.z-s),project(b.x-s+(j+1)*d-p,y0+p,b.z-s),project(b.x-s+(j+1)*d-p,y0+h/3-p,b.z-s),project(b.x-s+j*d+p,y0+h/3-p,b.z-s)],shade(cs[(i+j+2)%6],0.62));
    }
    return;
  }
  // 顶面中心标记（小菱形）
  var q=4;poly([project(b.x-q,h,b.z-q),project(b.x+q,h,b.z-q),project(b.x+q,h,b.z+q),project(b.x-q,h,b.z+q)],'rgba(255,255,255,0.45)');
}
function drawPlayer(){
  var p=player,sq=p.squash;
  if(state==='idle'||state==='charge'||state==='jump'){ // 脚下阴影
    var g=project(p.x,BLOCK_H,p.z);ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(g.x,g.y,9*SCALE,5*SCALE,0,0,Math.PI*2);ctx.fill();
  }
  var base=project(p.x,p.y,p.z);ctx.save();ctx.translate(base.x,base.y);
  if(p.rot){ctx.translate(0,-22*SCALE);ctx.rotate(jump&&jump.dir==='z'?-p.rot:p.rot);ctx.translate(0,22*SCALE);}
  if(p.tilt){ // 向外倾倒：屏幕方向 = 倾倒方向在屏幕上的投影
    var sx=(p.tdx-p.tdz);ctx.rotate(Math.min(p.tilt,1.2)*(sx>=0?1:-1));}
  ctx.scale(SCALE*(1+sq*0.3),SCALE*(1-sq));
  ctx.fillStyle='#3d3d55';ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.lineTo(5,-30);ctx.lineTo(-5,-30);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(0,-38,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 蓄力粒子
  var c=project(p.x,p.y,p.z);
  particles.forEach(function(q){ctx.fillStyle='rgba(90,100,130,'+(0.8*q.life)+')';
    ctx.beginPath();ctx.arc(c.x+q.ox*SCALE,c.y+q.oy*SCALE,2*SCALE,0,Math.PI*2);ctx.fill();});
}
function drawEffects(){
  rings.forEach(function(q){var e=ellipseAt(q.x,BLOCK_H,q.z,q.r*(0.4+q.t));
    ctx.strokeStyle=q.white?'rgba(255,255,255,'+(1-q.t)+')':'rgba(120,120,120,'+(0.5*(1-q.t))+')';
    ctx.lineWidth=(q.white?3:2)*SCALE;ctx.beginPath();ctx.ellipse(e.x,e.y,e.rx,e.ry,0,0,Math.PI*2);ctx.stroke();});
  ctx.lineWidth=1;ctx.textAlign='center';ctx.font='bold '+(22*SCALE|0)+'px sans-serif';
  popups.forEach(function(q){var p=project(q.x,q.y,q.z);ctx.globalAlpha=Math.max(0,q.life);
    ctx.fillStyle=q.color;ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.strokeText(q.text,p.x,p.y);ctx.fillText(q.text,p.x,p.y);ctx.globalAlpha=1;});
}
/* 深度排序：x+z 越大越远，先画远处。
   站立/跳跃时小人高于平台顶面，只有完全在它前面的平台才会遮挡它；
   掉落时小人低于顶面，中心比小人近的平台都遮挡它。 */
function render(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f4f6f9');g.addColorStop(1,'#d9dfe7');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var list=blocks.slice().sort(function(a,b){return (b.x+b.z)-(a.x+a.z);});
  list.forEach(drawShadow);
  var pd=player.x+player.z, low=(state==='fall'||state==='over');
  var front=function(b){return low?(b.x+b.z<pd):(b.x+b.z+2*b.s<pd-FOOT);};
  list.forEach(function(b){if(!front(b))drawBlock(b);});
  drawPlayer();
  list.forEach(function(b){if(front(b))drawBlock(b);});
  drawEffects();
}
var last=performance.now();
function loop(now){var dt=Math.min((now-last)/1000,0.05);last=now;update(dt);render();requestAnimationFrame(loop);}
resize();reset();requestAnimationFrame(loop);
// 测试接口
window.__game={get state(){return state;},get score(){return score;},get combo(){return combo;},
  need:function(off){var n=next();return (Math.hypot(n.x-player.x,n.z-player.z)+(off||0))/SPEED;},
  jump:function(t){if(state==='idle')doJump(t);},nextType:function(){return next().type;},nextS:function(){return next().s;},curType:function(){return cur().type;},get doubleLeft(){return doubleLeft;},
  onCenter:function(){var c=cur();return Math.hypot(player.x-c.x,player.z-c.z)<1;}};
})();
</script>
